<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-card">
            <h1>Reset password</h1>
            {% with messages = get_flashed_messages() %}{% if messages %}<div class="flash-box">{% for message in messages %}<p>{{ message }}</p>{% endfor %}</div>{% endif %}{% endwith %}
            <form method="POST" class="auth-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <label for="code">Reset code</label>
                <input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required>
                <label for="password">New password (10 characters minimum)</label>
                <input id="password" type="password" name="password" minlength="10" required>
                <label for="confirm_password">Confirm new password</label>
                <input id="confirm_password" type="password" name="confirm_password" minlength="10" required>
                <button type="submit">Set new password</button>
            </form>
        </section>
    </main>
</body>
</html>
