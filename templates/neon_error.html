<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Error{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='neon_effects.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Background animated grid */
        body::before {
            content: '';
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-image: 
                linear-gradient(0deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 1;
            animation: gridDrift 20s linear infinite;
        }

        @keyframes gridDrift {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Lightning container */
        .lightning-container {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none;
        }

        .lightning-bolt {
            position: absolute;
            stroke: #00d4ff;
            stroke-width: 2;
            filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.8));
            opacity: 0;
        }

        /* Main error container */
        .error-container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 600px;
            margin: 0 20px;
            animation: containerEnter 0.8s ease-out;
        }

        @keyframes containerEnter {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Neon frame */
        .neon-frame {
            border: 2px solid #00d4ff;
            border-radius: 10px;
            padding: 40px 30px;
            background: rgba(10, 14, 39, 0.8);
            backdrop-filter: blur(10px);
            box-shadow: 
                0 0 20px rgba(0, 212, 255, 0.3),
                inset 0 0 20px rgba(0, 212, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .neon-frame::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 30%, rgba(0, 212, 255, 0.1) 50%, transparent 70%);
            animation: shimmer 3s infinite;
            pointer-events: none;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Error code - massive neon number */
        .error-code {
            font-size: 120px;
            font-weight: 900;
            background: linear-gradient(135deg, #00d4ff, #00a8cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
            margin-bottom: 10px;
            animation: codePulse 2s ease-in-out infinite;
            letter-spacing: 20px;
        }

        @keyframes codePulse {
            0%, 100% {
                filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.6)) drop-shadow(0 0 20px rgba(0, 212, 255, 0.3));
            }
            50% {
                filter: drop-shadow(0 0 20px rgba(0, 212, 255, 1)) drop-shadow(0 0 40px rgba(0, 212, 255, 0.6));
            }
        }

        /* Title with neon glow */
        .error-title {
            font-size: 32px;
            color: #00d4ff;
            margin: 20px 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 700;
            animation: neonFlicker 0.15s infinite;
            text-shadow: 
                0 0 10px #00d4ff,
                0 0 20px #00a8cc,
                0 0 40px rgba(0, 212, 255, 0.5);
        }

        @keyframes neonFlicker {
            0% {
                text-shadow: 
                    0 0 10px #00d4ff,
                    0 0 20px #00a8cc,
                    0 0 40px rgba(0, 212, 255, 0.5);
            }
            19% {
                text-shadow: 
                    0 0 10px #00d4ff,
                    0 0 20px #00a8cc,
                    0 0 40px rgba(0, 212, 255, 0.5);
            }
            20% {
                text-shadow: none;
            }
            24% {
                text-shadow: 
                    0 0 10px #00d4ff,
                    0 0 20px #00a8cc,
                    0 0 40px rgba(0, 212, 255, 0.5);
            }
            25% {
                text-shadow: none;
            }
            54% {
                text-shadow: 
                    0 0 10px #00d4ff,
                    0 0 20px #00a8cc,
                    0 0 40px rgba(0, 212, 255, 0.5);
            }
            55% {
                text-shadow: none;
            }
            100% {
                text-shadow: 
                    0 0 10px #00d4ff,
                    0 0 20px #00a8cc,
                    0 0 40px rgba(0, 212, 255, 0.5);
            }
        }

        /* Message text */
        .error-message {
            color: #a0d8ff;
            font-size: 16px;
            line-height: 1.8;
            margin: 25px 0;
            letter-spacing: 1px;
            animation: messageGlow 2.5s ease-in-out infinite;
        }

        @keyframes messageGlow {
            0%, 100% {
                color: #a0d8ff;
                text-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
            }
            50% {
                color: #00d4ff;
                text-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
            }
        }

        /* Loading spinner */
        .loading-spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            margin: 20px auto;
            position: relative;
        }

        .spinner-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid transparent;
            border-top-color: #00d4ff;
            border-right-color: #00a8cc;
            border-radius: 50%;
            animation: spinnerRotate 1.5s linear infinite;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
        }

        .spinner-ring:nth-child(2) {
            border-top-color: #00a8cc;
            border-right-color: transparent;
            animation: spinnerRotate 1.5s linear infinite reverse;
            width: 80%;
            height: 80%;
            left: 10%;
            top: 10%;
            box-shadow: inset 0 0 20px rgba(0, 212, 255, 0.3);
        }

        @keyframes spinnerRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 35px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .neon-button {
            padding: 12px 30px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 2px solid #00d4ff;
            background: transparent;
            color: #00d4ff;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            display: inline-block;
        }

        .neon-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(0, 212, 255, 0.2);
            transition: left 0.3s ease;
            z-index: -1;
        }

        .neon-button:hover::before {
            left: 0;
        }

        .neon-button:hover {
            box-shadow: 
                0 0 10px rgba(0, 212, 255, 0.5),
                inset 0 0 10px rgba(0, 212, 255, 0.2);
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.8);
        }

        .neon-button:active {
            transform: scale(0.98);
        }

        /* Corner accents */
        .corner-accent {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid #00d4ff;
        }

        .corner-tl {
            top: 15px;
            left: 15px;
            border-right: none;
            border-bottom: none;
        }

        .corner-tr {
            top: 15px;
            right: 15px;
            border-left: none;
            border-bottom: none;
        }

        .corner-bl {
            bottom: 15px;
            left: 15px;
            border-right: none;
            border-top: none;
        }

        .corner-br {
            bottom: 15px;
            right: 15px;
            border-left: none;
            border-top: none;
        }

        /* Particles */
        .particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: #00d4ff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            animation: particleFloat 4s infinite;
            opacity: 0.6;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100px) translateX(30px);
                opacity: 0;
            }
        }

        /* Status indicator */
        .status-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #00d4ff;
            border-radius: 50%;
            margin: 0 8px;
            animation: statusPulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 10px #00d4ff;
        }

        @keyframes statusPulse {
            0%, 100% {
                opacity: 1;
                box-shadow: 0 0 10px #00d4ff, 0 0 20px rgba(0, 212, 255, 0.5);
            }
            50% {
                opacity: 0.5;
                box-shadow: 0 0 5px #00d4ff;
            }
        }
    </style>
</head>
<body>
    <!-- Lightning effects SVG container -->
    <svg class="lightning-container" id="lightningContainer"></svg>

    <!-- Main error/loading container -->
    <div class="error-container">
        <div class="neon-frame">
            <div class="corner-accent corner-tl"></div>
            <div class="corner-accent corner-tr"></div>
            <div class="corner-accent corner-bl"></div>
            <div class="corner-accent corner-br"></div>

            {% block content %}
            <!-- Content will be inserted here by child templates -->
            {% endblock %}
        </div>
    </div>

    <script>
        // Generate random lightning bolts
        function generateLightning() {
            const container = document.getElementById('lightningContainer');
            const bolt = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
            
            const startX = Math.random() * window.innerWidth;
            const startY = -10;
            const endX = startX + (Math.random() - 0.5) * 300;
            const endY = window.innerHeight + 10;
            
            const points = [startX, startY];
            
            // Generate random zigzag points
            let currentX = startX;
            let currentY = startY;
            
            for (let i = 0; i < 8; i++) {
                currentX += (Math.random() - 0.5) * 150;
                currentY += (window.innerHeight / 8);
                points.push(currentX, currentY);
            }
            
            points.push(endX, endY);
            
            bolt.setAttribute('points', points.join(' '));
            bolt.setAttribute('class', 'lightning-bolt');
            container.appendChild(bolt);
            
            // Animate the lightning
            let opacity = 0.8;
            let duration = 0.15;
            let elapsed = 0;
            const interval = setInterval(() => {
                elapsed += 0.03;
                if (elapsed < duration) {
                    opacity = 0.8 - (elapsed / duration) * 0.8;
                    bolt.style.opacity = opacity;
                } else {
                    clearInterval(interval);
                    bolt.remove();
                }
            }, 30);
        }

        // Generate lightning at random intervals
        function startLightningEffect() {
            generateLightning();
            const nextStrike = Math.random() * 4000 + 2000; // 2-6 seconds
            setTimeout(startLightningEffect, nextStrike);
        }

        // Generate floating particles
        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(particle);
            
            setTimeout(() => particle.remove(), 5000);
        }

        function startParticleEffect() {
            setInterval(createParticle, 300);
        }

        // Initialize effects on page load
        window.addEventListener('load', () => {
            startLightningEffect();
            startParticleEffect();
        });

        // Handle window resize for lightning
        window.addEventListener('resize', () => {
            const container = document.getElementById('lightningContainer');
            container.setAttribute('width', window.innerWidth);
            container.setAttribute('height', window.innerHeight);
        });
    </script>
</body>
</html>
